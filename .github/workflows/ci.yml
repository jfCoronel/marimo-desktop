name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Test against a *managed* (python-build-standalone) interpreter on every OS —
  # that's the kind ux embeds in the bundle. Without this, uv picks the runner's
  # system Python, which on Ubuntu has no tkinter and says nothing about ours.
  UV_PYTHON_PREFERENCE: only-managed

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and Linux have never been exercised before — the per-platform
        # branches in paths.py/gui.py get their first real run here.
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]   # matches requires-python >=3.12,<3.14

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # The control window needs tkinter; the bundled interpreter is supposed to
      # ship it on every platform. Checked separately so a missing _tkinter reads
      # as itself rather than as an opaque test-collection error.
      - name: Check tkinter is available
        run: uv run python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Tests
        run: uv run pytest

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
