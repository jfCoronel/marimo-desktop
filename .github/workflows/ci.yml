name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Test against a *managed* (python-build-standalone) interpreter on every OS —
  # that's the kind ux embeds in the bundle. Without this, uv picks the runner's
  # system Python, which on Ubuntu has no tkinter and says nothing about ours.
  UV_PYTHON_PREFERENCE: only-managed

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]   # matches requires-python >=3.12,<3.14

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # The control window needs tkinter; the bundled interpreter is supposed to
      # ship it on every platform. Checked separately so a missing _tkinter reads
      # as itself rather than as an opaque test-collection error.
      - name: Check tkinter is available
        run: uv run python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Tests
        run: uv run pytest

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS ships from Briefcase now (see the macos-app job); ux only
        # builds what we actually distribute for Linux and Windows.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # No cache here: this job only installs ux and runs a stdlib script,
          # and the post-job `uv cache prune` is one more thing that can hang.
          enable-cache: false

      - name: Install ux
        run: uv tool install ux-py

      - name: Build bundle (binary)
        run: ux bundle --output ./dist/

      # The tests prove the code works; this proves the *artifact* does — it
      # launches, bootstraps its own interpreter, and gets marimo answering.
      # First run downloads the interpreter and wheels, hence the long timeout.
      - name: Smoke test the bundle (Linux)
        if: runner.os == 'Linux'
        run: uv run --no-project python scripts/smoke_bundle.py dist/marimo-desktop

      - name: Smoke test the bundle (Windows)
        if: runner.os == 'Windows'
        run: uv run --no-project python scripts/smoke_bundle.py dist/marimo-desktop.exe

      # The smoke test runs headless; this proves the control window's
      # toolkit loads too (no display needed).
      - name: The control window's toolkit must load (Linux)
        if: runner.os == 'Linux'
        run: dist/marimo-desktop --check-gui

      - name: The control window's toolkit must load (Windows)
        if: runner.os == 'Windows'
        run: dist/marimo-desktop.exe --check-gui

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            dist/marimo-desktop
            dist/marimo-desktop.exe
          if-no-files-found: error
          retention-days: 14

  # The macOS artifact is built by Briefcase; ux's signature is rejected by
  # Gatekeeper outright. Verified here on every push so a break shows up
  # before a release rather than during one.
  macos-app:
    name: macOS app (briefcase)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install briefcase
        # Briefcase must run on an interpreter that satisfies requires-python
        # (<3.14), or it refuses the project.
        run: uv tool install --python 3.13 briefcase

      - name: Build the app
        run: |
          briefcase create macOS
          briefcase build macOS

      - name: Smoke test the app
        run: |
          uv run --no-project python scripts/smoke_bundle.py \
            "build/marimo-desktop/macos/app/marimo desktop.app"

      # Briefcase's Python has no tkinter, so the window runs on the Python
      # uv provides; the headless smoke test never touches that path.
      - name: The control window's toolkit must load
        run: '"build/marimo-desktop/macos/app/marimo desktop.app/Contents/MacOS/marimo desktop" --check-gui'

      - name: The signature must actually validate
        run: |
          codesign --verify --verbose=2 "build/marimo-desktop/macos/app/marimo desktop.app"
