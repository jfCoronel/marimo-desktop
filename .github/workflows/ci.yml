name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Test against a *managed* (python-build-standalone) interpreter on every OS —
  # that's the kind ux embeds in the bundle. Without this, uv picks the runner's
  # system Python, which on Ubuntu has no tkinter and says nothing about ours.
  UV_PYTHON_PREFERENCE: only-managed

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and Linux have never been exercised before — the per-platform
        # branches in paths.py/gui.py get their first real run here.
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]   # matches requires-python >=3.12,<3.14

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # The control window needs tkinter; the bundled interpreter is supposed to
      # ship it on every platform. Checked separately so a missing _tkinter reads
      # as itself rather than as an opaque test-collection error.
      - name: Check tkinter is available
        run: uv run python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Tests
        run: uv run pytest

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install ux
        run: uv tool install ux-py

      # macOS gets the .app (icon, Dock name, double-clickable); everywhere else
      # ux produces a plain binary — `--format app` is macOS-only.
      - name: Build bundle (macOS .app)
        if: runner.os == 'macOS'
        run: ux bundle --format app --output ./dist/

      - name: Build bundle (binary)
        if: runner.os != 'macOS'
        run: ux bundle --output ./dist/

      # The tests prove the code works; this proves the *artifact* does — it
      # launches, bootstraps its own interpreter, and gets marimo answering.
      # First run downloads the interpreter and wheels, hence the long timeout.
      - name: Smoke test the bundle (macOS)
        if: runner.os == 'macOS'
        run: uv run --no-project python scripts/smoke_bundle.py dist/marimo-desktop.app

      - name: Smoke test the bundle (Linux)
        if: runner.os == 'Linux'
        run: uv run --no-project python scripts/smoke_bundle.py dist/marimo-desktop

      - name: Smoke test the bundle (Windows)
        if: runner.os == 'Windows'
        run: uv run --no-project python scripts/smoke_bundle.py dist/marimo-desktop.exe

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            dist/marimo-desktop.app
            dist/marimo-desktop
            dist/marimo-desktop.exe
          if-no-files-found: error
          retention-days: 14
